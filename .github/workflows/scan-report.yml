name: Trivy Scan Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run scan.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scan.sh master --prime

      - name: Determine output filename
        id: filename
        run: |
          DATE=$(date +%Y%m%d)
          N=1
          while [ -f "reports/scan-${DATE}-${N}.md" ]; do
            N=$((N + 1))
          done
          echo "filename=reports/scan-${DATE}-${N}.md" >> "$GITHUB_OUTPUT"

      - name: Move report to reports directory
        run: mv trivy_scan_report.txt "${{ steps.filename.outputs.filename }}"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.filename.outputs.filename }}"
          git commit -m "chore: add scan report ${{ steps.filename.outputs.filename }}"
          git push
