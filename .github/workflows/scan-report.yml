name: Trivy Scan Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'RKE2 branch to scan instead of master (e.g. release-1.36). Mutually exclusive with release_version and pr_number.'
        required: false
        type: string
        default: ''
      release_version:
        description: 'RKE2 release version to scan (e.g. v1.36.1+rke2r1). Mutually exclusive with branch and pr_number.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'PR number or URL to scan (e.g. 9994 or https://github.com/rancher/rke2/pull/9994). Mutually exclusive with branch and release_version.'
        required: false
        type: string
        default: ''
      scan_runtime_image:
        description: 'Include the rke2-runtime artifact/tarball scan (branch/PR scans only).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: reports-commit
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build scan target matrix
        id: set
        run: |
          # Scheduled runs scan master plus every active release branch, one at
          # a time (max-parallel: 1 in the scan job). Edit this list when the set
          # of active release branches changes.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'matrix={"target":["master","release-1.34","release-1.35","release-1.36","release-1.37"]}' >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: a single passthrough entry; the actual target is
            # derived from the inputs inside the scan job.
            echo 'matrix={"target":["dispatch"]}' >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # Serial so the per-branch commit/push steps never race on the reports
      # branch. Combined with the branch-tip checkout below, each job starts from
      # the commit the previous job just pushed, so every push fast-forwards.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the current branch tip rather than the workflow's frozen
          # trigger SHA. Each serial matrix job commits a report to this branch,
          # so a job that started from the stale trigger SHA would always push
          # against an advanced remote, forcing the commit step's rebase-retry
          # path (which previously stranded release-branch reports). Starting
          # from the live tip lets every push fast-forward cleanly.
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Patch Trivy and build from source
        run: |
          TMP_TRIVY_DIR="tmp-trivy"
          mkdir "${TMP_TRIVY_DIR}"
          cd "${TMP_TRIVY_DIR}"
          # Clone Trivy at commit of immutable release v0.70.0 - https://github.com/aquasecurity/trivy/releases/tag/v0.70.0
          git clone --revision 8a3177aedf7ee0864920eb1852eef031cd3742b8 --depth 1 https://github.com/aquasecurity/trivy.git
          cd trivy
          # Patch fixes incorrect SBOM relationships for OS packages, which is required
          # to correctly apply VEX statements to SLES RPMs (matches rancher/image-scanning).
          git apply ../../patch/sbom.patch
          GOEXPERIMENT=jsonv2 go build ./cmd/trivy/
          sudo install trivy /usr/local/bin
          cd ../..
          rm -rf "${TMP_TRIVY_DIR}"
          trivy --version

      - name: Build scan.sh arguments
        id: scan_args
        env:
          TARGET: ${{ matrix.target }}
        run: |
          RUNTIME_ARG="--runtime"
          BRANCH_NAME=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.scan_runtime_image }}" = "true" ]; then
              RUNTIME_ARG="--runtime"
            else
              RUNTIME_ARG="--no-runtime"
            fi

            # Guard against mutually exclusive inputs being set together.
            SELECTED=0
            [ -n "${{ inputs.release_version }}" ] && SELECTED=$((SELECTED + 1))
            [ -n "${{ inputs.pr_number }}" ] && SELECTED=$((SELECTED + 1))
            [ -n "${{ inputs.branch }}" ] && SELECTED=$((SELECTED + 1))
            if [ "$SELECTED" -gt 1 ]; then
              echo "Error: branch, release_version, and pr_number are mutually exclusive; set at most one." >&2
              exit 1
            fi

            if [ -n "${{ inputs.release_version }}" ]; then
              ARGS="--release ${{ inputs.release_version }} ${RUNTIME_ARG}"
              MODE="release"
            elif [ -n "${{ inputs.pr_number }}" ]; then
              ARGS="--pr ${{ inputs.pr_number }} ${RUNTIME_ARG}"
              MODE="pr"
            elif [ -n "${{ inputs.branch }}" ]; then
              ARGS="${{ inputs.branch }} --prime ${RUNTIME_ARG}"
              MODE="branch"
              BRANCH_NAME="${{ inputs.branch }}"
            else
              ARGS="master --prime ${RUNTIME_ARG}"
              MODE="scheduled"
            fi
          else
            # Scheduled run: TARGET comes from the prepare job's matrix. master
            # keeps the "scheduled" mode (dated filename + community comparison);
            # release branches are scanned as branch-mode targets.
            if [ "$TARGET" = "master" ]; then
              ARGS="master --prime ${RUNTIME_ARG}"
              MODE="scheduled"
            else
              ARGS="${TARGET} --prime ${RUNTIME_ARG}"
              MODE="branch"
              BRANCH_NAME="${TARGET}"
            fi
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run scan.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: bash scan.sh ${{ steps.scan_args.outputs.args }}

      - name: Determine output filename
        id: filename
        run: |
          MODE="${{ steps.scan_args.outputs.mode }}"
          if [ "$MODE" = "release" ]; then
            RELEASE="${{ inputs.release_version }}"
            SAFE_RELEASE=$(echo "$RELEASE" | sed -E 's/\+/\./g; s/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')
            if [ -z "$SAFE_RELEASE" ]; then
              SAFE_RELEASE="release"
            fi
            BASE="scan-${SAFE_RELEASE}"
            N=1
            while [ -f "reports/${BASE}-${N}.md" ]; do
              N=$((N + 1))
            done
            echo "filename=reports/${BASE}-${N}.md" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "pr" ]; then
            PR="${{ inputs.pr_number }}"
            # Extract just the number if a full URL was provided
            PR_NUM=$(echo "$PR" | grep -oE '[0-9]+$')
            echo "filename=reports/pr-${PR_NUM}.md" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "branch" ]; then
            BRANCH_INPUT="${{ steps.scan_args.outputs.branch_name }}"
            SAFE_BRANCH=$(echo "$BRANCH_INPUT" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')
            if [ -z "$SAFE_BRANCH" ]; then
              SAFE_BRANCH="branch"
            fi
            BASE="scan-${SAFE_BRANCH}"
            N=1
            while [ -f "reports/${BASE}-${N}.md" ]; do
              N=$((N + 1))
            done
            echo "filename=reports/${BASE}-${N}.md" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date +%Y%m%d)
            N=1
            while [ -f "reports/scan-${DATE}-${N}.md" ]; do
              N=$((N + 1))
            done
            echo "filename=reports/scan-${DATE}-${N}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Move report to reports directory
        run: mv trivy_scan_report.txt "${{ steps.filename.outputs.filename }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run community (non-prime) scan for CVE comparison
        # Scheduled nightly only: scan the same master images without --prime so
        # the metrics DB captures community/DockerHub CVE counts alongside the
        # prime run. This intentionally produces no committed markdown/HTML
        # report; only reports/scan_metrics.db is updated (and committed below).
        # Runs before HTML generation so the index reflects the community line.
        if: steps.scan_args.outputs.mode == 'scheduled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          bash scan.sh master --no-prime --runtime
          rm -f trivy_scan_report.txt images.txt images-optional.txt

      - name: Convert Markdown report to HTML
        id: convert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_MODEL: openai/gpt-4.1-mini
        run: |
          INPUT="${{ steps.filename.outputs.filename }}"
          BASENAME=$(basename "${INPUT%.md}")
          mkdir -p reports/html
          OUTPUT="reports/html/${BASENAME}.html"
          python3 .github/scripts/scan_to_html.py "$INPUT" "$OUTPUT"
          python3 .github/scripts/scan_to_html.py --index reports/html
          echo "html_file=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_number }}-${{ matrix.target }}
          path: ${{ steps.convert.outputs.html_file }}
          if-no-files-found: error

      - name: Commit and push report + HTML
        run: |
          MARKDOWN="${{ steps.filename.outputs.filename }}"
          HTML="${{ steps.convert.outputs.html_file }}"
          BRANCH="${{ github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The markdown report is the scan's non-regenerable output and only
          # exists in the retry commit; back it up outside the work tree so the
          # reset --hard below can't delete it and strand the retry loop.
          REPORT_BACKUP="$(mktemp)"
          cp "$MARKDOWN" "$REPORT_BACKUP"

          for attempt in 1 2 3; do
            # Restore the report in case a previous iteration's reset --hard removed it.
            mkdir -p "$(dirname "$MARKDOWN")"
            cp "$REPORT_BACKUP" "$MARKDOWN"

            # Regenerate HTML/index from the current tree (post-rebase on retries)
            python3 .github/scripts/scan_to_html.py "$MARKDOWN" "$HTML"
            python3 .github/scripts/scan_to_html.py --index reports/html

            git add "$MARKDOWN" "$HTML" reports/html/index.html
            if [ -f reports/scan_metrics.db ]; then
              git add reports/scan_metrics.db
            fi
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "chore: add scan report and HTML for $MARKDOWN"

            git fetch origin "$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi

            echo "Push failed (attempt $attempt/3), retrying..."
            # Drop the local retry commit and restore a clean index/worktree before rebasing.
            git reset --hard HEAD~1
            git pull --rebase origin "$BRANCH"
          done

          echo "Failed to push report and HTML after 3 attempts"
          exit 1
