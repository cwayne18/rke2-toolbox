name: Convert Check Images Report to HTML

on:
  workflow_run:
    workflows:
      - Check Images Report
    types:
      - completed
  push:
    paths:
      - 'reports/check-*.md'
  workflow_dispatch:
    inputs:
      check_file:
        description: >
          Path to the check-*.md file inside the reports/ directory
          (e.g. reports/check-20260515-1.md).  Glob patterns such as
          reports/check-*.md are also accepted; when multiple files match the
          most recently modified one is used.
        required: true
        type: string
        default: 'reports/check-*.md'

permissions:
  contents: write

concurrency:
  group: html-reports
  cancel-in-progress: false

jobs:
  convert:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve check-images file
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            # Detect check-*.md files added/modified in this push
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # Initial push — list all check-*.md files by recency
              FILE=$(ls -t reports/check-*.md 2>/dev/null | head -n 1)
            else
              FILE=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'reports/check-*.md' 2>/dev/null | head -n 1)
            fi
            if [ -z "$FILE" ]; then
              # Fallback to most recently modified
              FILE=$(ls -t reports/check-*.md 2>/dev/null | head -n 1)
            fi
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # For chained runs, use the most recently generated check report.
            FILE=$(ls -t reports/check-*.md 2>/dev/null | head -n 1)
          else
            INPUT="${{ inputs.check_file }}"
            # Expand glob if needed
            if echo "$INPUT" | grep -q '[*?[]'; then
              FILE=$(ls -t $INPUT 2>/dev/null | head -n 1)
              if [ -z "$FILE" ]; then
                echo "::error::No files match the pattern: $INPUT"
                exit 1
              fi
            else
              FILE="$INPUT"
            fi
          fi

          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE"
            exit 1
          fi

          echo "check_file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved check-images file: $FILE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert Markdown report to HTML
        id: convert
        run: |
          INPUT="${{ steps.resolve.outputs.check_file }}"
          BASENAME=$(basename "${INPUT%.md}")
          mkdir -p reports/html
          OUTPUT="reports/html/${BASENAME}.html"
          python3 .github/scripts/scan_to_html.py "$INPUT" "$OUTPUT"
          echo "html_file=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-images-report-${{ github.run_number }}
          path: ${{ steps.convert.outputs.html_file }}
          if-no-files-found: error

      - name: Commit HTML report to repository
        run: |
          HTML="${{ steps.convert.outputs.html_file }}"
          BRANCH="${{ github.ref_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Regenerate index from the current tree (post-rebase on retries)
            python3 .github/scripts/scan_to_html.py --index reports/html

            git add "$HTML" reports/html/index.html

            if git diff --cached --quiet; then
              echo "HTML report is already up-to-date, nothing to commit."
              exit 0
            fi

            git commit -m "chore: add HTML report for ${{ steps.resolve.outputs.check_file }}"

            git fetch origin "$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi

            echo "Push failed (attempt $attempt/3), retrying..."
            git reset --soft HEAD~1
            git pull --rebase origin "$BRANCH"
          done

          echo "::error::Failed to push HTML report after 3 attempts."
          exit 1
