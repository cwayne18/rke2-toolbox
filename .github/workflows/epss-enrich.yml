name: Refresh EPSS Scores

# Keeps the CVE database's EPSS (exploitation-probability) scores fresh. The
# nightly Trivy scan already enriches each new scan's CVEs; this workflow
# backfills historical rows and refreshes drifting scores across the whole
# database on a weekly cadence (or on demand). It only touches the sqlite DB —
# committed HTML reports are regenerated by the scan/deploy workflows.

on:
  schedule:
    # Weekly, Monday 07:00 UTC (an hour after the daily scan window).
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      only_missing:
        description: 'Only fill rows that have no EPSS score yet (preserve existing values).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reports-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh EPSS scores in the metrics database
        run: |
          if [ ! -f reports/scan_metrics.db ]; then
            echo "No metrics database found; nothing to refresh."
            exit 0
          fi
          ARGS="--db reports/scan_metrics.db"
          if [ "${{ inputs.only_missing }}" = "true" ]; then
            ARGS="$ARGS --only-missing"
          fi
          python3 .github/scripts/epss_enrich.py $ARGS

      - name: Commit and push updated database
        run: |
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add reports/scan_metrics.db
            if git diff --cached --quiet; then
              echo "No EPSS changes to commit"
              exit 0
            fi

            git commit -m "chore: refresh EPSS scores in scan_metrics.db"

            git fetch origin "$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi

            echo "Push failed (attempt $attempt/3), retrying..."
            git reset --hard HEAD~1
            git pull --rebase origin "$BRANCH"
          done

          echo "Failed to push EPSS refresh after 3 attempts"
          exit 1
