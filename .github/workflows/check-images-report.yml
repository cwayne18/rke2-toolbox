name: Check Images Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run check_images.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash check_images.sh master --prime

      - name: Determine output filename
        id: filename
        run: |
          DATE=$(date +%Y%m%d)
          N=1
          while [ -f "reports/check-${DATE}-${N}.md" ]; do
            N=$((N + 1))
          done
          echo "filename=reports/check-${DATE}-${N}.md" >> "$GITHUB_OUTPUT"

      - name: Move report to reports directory
        run: mv image_update_report.txt "${{ steps.filename.outputs.filename }}"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.filename.outputs.filename }}"
          git commit -m "chore: add check-images report ${{ steps.filename.outputs.filename }}"
          git push
