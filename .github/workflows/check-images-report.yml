name: Check Images Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'RKE2 release branch to check (e.g. release-1.35). Defaults to master when empty.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: reports-commit
  cancel-in-progress: false

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build check_images.sh arguments
        id: check_args
        run: |
          ARGS="master --prime"
          MODE="scheduled"
          if [ -n "${{ inputs.release_branch }}" ]; then
            ARGS="--release ${{ inputs.release_branch }} --prime"
            MODE="release"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run check_images.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash check_images.sh ${{ steps.check_args.outputs.args }}

      - name: Determine output filename
        id: filename
        run: |
          MODE="${{ steps.check_args.outputs.mode }}"
          if [ "$MODE" = "release" ]; then
            RELEASE="${{ inputs.release_branch }}"
            SAFE_RELEASE=$(echo "$RELEASE" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')
            if [ -z "$SAFE_RELEASE" ]; then
              SAFE_RELEASE="release"
            fi
            BASE="check-${SAFE_RELEASE}"
          else
            DATE=$(date +%Y%m%d)
            BASE="check-${DATE}"
          fi
          N=1
          while [ -f "reports/${BASE}-${N}.md" ]; do
            N=$((N + 1))
          done
          echo "filename=reports/${BASE}-${N}.md" >> "$GITHUB_OUTPUT"

      - name: Move report to reports directory
        run: mv image_update_report.txt "${{ steps.filename.outputs.filename }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert Markdown report to HTML
        id: convert
        run: |
          INPUT="${{ steps.filename.outputs.filename }}"
          BASENAME=$(basename "${INPUT%.md}")
          mkdir -p reports/html
          OUTPUT="reports/html/${BASENAME}.html"
          python3 .github/scripts/scan_to_html.py "$INPUT" "$OUTPUT"
          python3 .github/scripts/scan_to_html.py --index reports/html
          echo "html_file=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-images-report-${{ github.run_number }}
          path: ${{ steps.convert.outputs.html_file }}
          if-no-files-found: error

      - name: Commit and push report + HTML
        run: |
          MARKDOWN="${{ steps.filename.outputs.filename }}"
          HTML="${{ steps.convert.outputs.html_file }}"
          BRANCH="${{ github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Regenerate HTML/index from the current tree (post-rebase on retries)
            python3 .github/scripts/scan_to_html.py "$MARKDOWN" "$HTML"
            python3 .github/scripts/scan_to_html.py --index reports/html

            git add "$MARKDOWN" "$HTML" reports/html/index.html
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "chore: add check-images report and HTML for $MARKDOWN"

            git fetch origin "$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi

            echo "Push failed due to concurrent update, retrying ($attempt/3)..."
            git reset --soft HEAD~1
            git pull --rebase origin "$BRANCH"
          done

          echo "Failed to push report and HTML after 3 attempts"
          exit 1
