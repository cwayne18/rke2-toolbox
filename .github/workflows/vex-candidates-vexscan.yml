name: VEX Candidates (vexscan)

# Prototype: same triage as "VEX Candidates", but the presence analysis is done
# by github.com/cwayne18/vexscan instead of the in-tree pclntab/govulncheck
# code. Runs in parallel with the original workflow so the two can be diffed
# before cutting over. Opens/updates a separate issue (label vex-candidate-vexscan)
# so it never collides with the production one.

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Specific report path (e.g. reports/scan-20260623-1.md). Default: latest.'
        required: false
        type: string
        default: ''
      modules:
        description: 'Comma-separated Go modules to evaluate.'
        required: false
        type: string
        default: 'golang.org/x/net,golang.org/x/crypto'
      vexscan_version:
        description: 'vexscan version to install (git ref or version tag).'
        required: false
        type: string
        default: 'latest'

permissions:
  contents: read
  issues: write

concurrency:
  group: vex-candidates-vexscan
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Install vexscan
        env:
          VEXSCAN_VERSION: ${{ inputs.vexscan_version }}
        run: |
          go install "github.com/cwayne18/vexscan@${VEXSCAN_VERSION:-latest}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Generate VEX candidates (vexscan)
        id: gen
        env:
          REPORT_INPUT: ${{ inputs.report }}
          MODULES_INPUT: ${{ inputs.modules }}
        run: |
          ARGS=()
          if [ -n "${REPORT_INPUT}" ]; then
            ARGS+=(--report "${REPORT_INPUT}")
          fi
          if [ -n "${MODULES_INPUT}" ]; then
            ARGS+=(--modules "${MODULES_INPUT}")
          fi
          python3 .github/scripts/vexscan_candidates.py "${ARGS[@]}" --github-output "${GITHUB_OUTPUT}"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vex-candidates-vexscan-${{ steps.gen.outputs.report_name }}
          path: |
            vex-candidates.json
            vex-candidates.text-vex
            vex-candidates-issue.md
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update candidate issue
        if: ${{ steps.gen.outputs.candidate_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_NAME: ${{ steps.gen.outputs.report_name }}
        run: |
          TITLE="VEX candidates (vexscan): ${REPORT_NAME}"
          LABEL="vex-candidate-vexscan"

          gh label create "${LABEL}" --color BFD4F2 \
            --description "Automated manual-VEX candidates (vexscan-based, prototype)" 2>/dev/null || true

          EXISTING=$(gh issue list --state open --label "${LABEL}" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)

          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --body-file vex-candidates-issue.md
            echo "Updated issue #${EXISTING}"
          else
            gh issue create --title "${TITLE}" --label "${LABEL}" \
              --body-file vex-candidates-issue.md
          fi

      - name: No candidates summary
        if: ${{ steps.gen.outputs.candidate_count == '0' }}
        run: echo "No VEX candidates found for ${{ steps.gen.outputs.report_name }} — nothing to file."
